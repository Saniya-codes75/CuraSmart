<!DOCTYPE html>
<html>
<head>
    <title>CuraSmart - Login</title>
    <style>
        /* Same CSS as signup.html */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        .btn { background-color: #007bff; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Patient Login</h2>
        <form method="POST">
            {% csrf_token %}
            <p>Username: <input type="text" name="username" required></p>
            <p>Password: <input type="password" name="password" required></p>
            <button type="submit" class="btn">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">New user? <a href="{% url 'signup' %}">Sign up here</a></p>
    </div>
</body>
</html>
