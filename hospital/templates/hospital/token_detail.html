{% extends 'hospital/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5 text-center text-white shadow-lg">
                <h1 class="display-4 mb-4">Token Generated!</h1>
                <div class="rounded-circle bg-primary d-inline-block p-4 mb-4" style="width: 100px; height: 100px;">
                    <h2 class="m-0 pt-1">#{{ token.token_number }}</h2>
                </div>
                <h3>Dr. {{ token.doctor.name }}</h3>
                <p class="text-light">{{ token.doctor.specialty }}</p>
                <hr class="bg-light">
                <p>Patient: <strong>{{ token.patient.username }}</strong></p>
                <p>Date: {{ token.created_at|date:"D, d M Y" }}</p>
                
                <div class="mt-4">
                    <a href="{% url 'doctor_list' %}" class="btn btn-outline-light">Back to Doctors</a>
                    <button onclick="window.print()" class="btn btn-success">Print Token</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
